server:
  servlet:
    context-path: /jobpuzzle

spring:
  profiles:
    include: local
  application:
    name: jobpuzzle
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/jobpuzzle}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      # TODO(team): context path 적용에 맞춰 카카오·구글 콘솔 callback URI를
      # /jobpuzzle/login/oauth2/code/{registrationId} 형식으로 갱신한다.
      client:
        registration:
          #카카오 API KEY
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - profile
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

  mail:
    host: smtp.naver.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
        starttls:
          enable: false

app:
  guide:
    preprocessing:
      # 관리자 명시 호출에서만 실행한다. 활성화는 별도 검수 API로 분리한다.
      enabled: ${GUIDE_PREPROCESSING_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      model: ${GUIDE_PREPROCESSING_MODEL:gpt-5.6-terra}
      request-timeout: ${GUIDE_PREPROCESSING_TIMEOUT:60s}
    vector:
      collection: ${GUIDE_VECTOR_COLLECTION:job-guide-chunks-te3small-v1}
      top-k: ${GUIDE_VECTOR_TOP_K:8}

  # fake가 기본값이며 real은 OpenAI·Qdrant 환경변수가 모두 제공될 때만 선택한다.
  rag:
    mode: ${RAG_MODE:fake}

    embedding:
      provider: openai
      model: ${RAG_EMBEDDING_MODEL:text-embedding-3-small}
      dimension: ${RAG_EMBEDDING_DIMENSION:1536}

    request-timeout: ${RAG_REQUEST_TIMEOUT:10s}

    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}

    qdrant:
      url: ${QDRANT_URL:http://localhost:6333}
      api-key: ${QDRANT_API_KEY:}
      collection: ${QDRANT_COLLECTION:analysis-material-chunks-te3small-v1}

  ai:
    running-timeout-seconds: 600
    # 생성 AI와 RAG embedding은 역할·비용·장애 계약이 달라 별도 설정으로 유지한다.
    generation:
      # 운영 기본은 모든 생성 stage가 같은 provider를 사용한다. stage override는 ai-e2e profile에서만 둔다.
      default-provider: ${AI_GENERATION_DEFAULT_PROVIDER:mock}
      anthropic:
        api-key: ${ANTHROPIC_API_KEY:}
        model: ${ANTHROPIC_MODEL:}
        base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
        api-version: ${ANTHROPIC_API_VERSION:2023-06-01}
        request-timeout: ${ANTHROPIC_REQUEST_TIMEOUT:30s}
        max-output-tokens:
          json-01: ${ANTHROPIC_JSON01_MAX_OUTPUT_TOKENS:4096}
          json-02: ${ANTHROPIC_JSON02_MAX_OUTPUT_TOKENS:6144}
          json-05: ${ANTHROPIC_JSON05_MAX_OUTPUT_TOKENS:8192}
          json-06: ${ANTHROPIC_JSON06_MAX_OUTPUT_TOKENS:4096}
          json-07: ${ANTHROPIC_JSON07_MAX_OUTPUT_TOKENS:6144}
          json-09: ${ANTHROPIC_JSON09_MAX_OUTPUT_TOKENS:6144}
          json-10: ${ANTHROPIC_JSON10_MAX_OUTPUT_TOKENS:2048}
          json-11: ${ANTHROPIC_JSON11_MAX_OUTPUT_TOKENS:4096}
      input-limits:
        # fixture 8·9 실측보다 충분히 큰 기본값이다. 초과 입력은 자동 축약하지 않고 Provider 호출 전에 실패한다.
        json-01-rendered-prompt-chars: ${AI_JSON01_RENDERED_PROMPT_CHARS:40000}
        json-02-rendered-prompt-chars: ${AI_JSON02_RENDERED_PROMPT_CHARS:50000}
        # JSON-02 partition은 marker를 자르지 않으며, 한도를 넘으면 다음 partition으로 넘긴다.
        json-02-partition-marker-content-chars: ${AI_JSON02_PARTITION_MARKER_CONTENT_CHARS:12000}
        json-02-partition-max-markers: ${AI_JSON02_PARTITION_MAX_MARKERS:8}
        json-05-requirement-count: ${AI_JSON05_REQUIREMENT_COUNT:20}
        json-05-retrieval-chars: ${AI_JSON05_RETRIEVAL_CHARS:36000}
        json-05-rendered-prompt-chars: ${AI_JSON05_RENDERED_PROMPT_CHARS:64000}

  data-initializer:
    enabled: false

  storage:
    local:
      base-dir: ./storage/documents

  ocr:
    google-vision:
      credentials-path: ./credentials/google-vision-service-account.json

evaluation:
  pass-threshold: 70
