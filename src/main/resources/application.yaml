spring:
  profiles:
    include: local
  application:
    name: jobpuzzle
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3307/jobpuzzle}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          #카카오 API KEY
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - profile
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  mail:
    host: smtp.naver.com
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
        starttls:
          enable: false

app:
  ai:
    running-timeout-seconds: 600
    # MOCK 또는 ANTHROPIC. 실제 키는 application-local.yaml이나 환경변수로 주입
    provider: ${AI_PROVIDER:MOCK}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-sonnet-5}
      max-tokens: ${ANTHROPIC_MAX_TOKENS:8000}

  data-initializer:
    enabled: false

  storage:
    local:
      base-dir: ./storage/documents

  ocr:
    google-vision:
      credentials-path: ./credentials/google-vision-service-account.json

evaluation:
  pass-threshold: 70
