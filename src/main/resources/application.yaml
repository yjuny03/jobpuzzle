spring:
  profiles:
    include: local
  application:
    name: jobpuzzle
  datasource:
    url: jdbc:mariadb://localhost:3306/jobpuzzle
    # 아이디/비밀번호는 application-local.yaml(각자 로컬 전용, git 추적 안 됨)에서 채움
    username:
    password:
    driver-class-name: org.mariadb.jdbc.Driver
  security:
    oauth2:
      client:
        registration:
          #카카오 API KEY
          kakao:
            client-id:
            client-secret:
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
          google:
            scope:
              - profile
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: smtp.naver.com
    port: 465
    username:
    password:
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
        starttls:
          enable: false
app:
  data-initializer:
    enabled: false

  storage:
    local:
      base-dir: ./storage/documents

  ocr:
    google-vision:
      credentials-path: ./credentials/google-vision-service-account.json
