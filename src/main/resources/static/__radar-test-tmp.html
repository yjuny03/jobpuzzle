<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>레이더 라벨 크기 테스트 (실제 레이아웃)</title>
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/interview-result.css">
<style>
  .test-panel { position: sticky; top: 0; background:#fff; border-bottom:2px solid #185FA5; padding:14px 20px; z-index:99; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .test-panel h2 { margin:0 0 10px; font-size:15px; }
  .test-panel .row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .test-panel label { width:150px; font-size:12.5px; }
  .test-panel input[type=range] { flex:1; max-width:300px; }
  .test-panel .val { width:70px; font-size:12.5px; text-align:right; }
  .count-tabs { display:flex; gap:8px; margin-bottom:10px; }
  .count-tabs button { padding:5px 12px; border-radius:20px; border:1px solid #ccc; background:#fff; cursor:pointer; font-size:12.5px; }
  .count-tabs button.active { background:#185FA5; color:#fff; border-color:#185FA5; }
  .ok-btn { padding:8px 16px; border-radius:8px; border:none; background:#185FA5; color:#fff; font-size:13px; cursor:pointer; }
  .summary { margin-top:8px; font-size:12px; color:#555; white-space:pre-line; }
</style>
</head>
<body>

<div class="test-panel">
  <h2>레이더 라벨 폰트 크기 테스트 (실제 카드 폭 · 전체점수 링 포함)</h2>
  <div class="count-tabs" id="countTabs"></div>
  <div class="row">
    <label>라벨 폰트 크기</label>
    <input type="range" id="labelSize" min="7" max="20" step="0.5">
    <span class="val" id="labelSizeVal"></span>
  </div>
  <div class="row">
    <label>점수 폰트 크기</label>
    <input type="range" id="scoreSize" min="6" max="18" step="0.5">
    <span class="val" id="scoreSizeVal"></span>
    <button class="ok-btn" id="okBtn">이 그룹 OK</button>
  </div>
  <div class="summary" id="summary"></div>
</div>

<div class="app-shell">
  <main class="app-container">
    <div class="result-layout">
      <div class="tab-panel" data-panel="final">
        <section class="card final-report-panel">
          <div id="dimension-visual" class="dimension-visual"></div>
        </section>
      </div>
    </div>
  </main>
</div>

<script>
var ALL_LABELS = [
  { key:'requirementConnection', label:'공고 요구사항 연결', value: 78 },
  { key:'resultExpression', label:'성과 및 결과 표현', value: 92 },
  { key:'problemSolving', label:'문제 해결 과정', value: 65 },
  { key:'guideAlignment', label:'직무 가이드 적합', value: 54 },
  { key:'deliveryClarity', label:'답변 전달력', value: 88 },
  { key:'intentMatch', label:'질문 의도 이해', value: 71 },
  { key:'specificity', label:'경험 구체성', value: 60 },
  { key:'ownRole', label:'본인 역할', value: 45 }
];

var GROUPS = [
  { id: 'g4', label: '3~4개', count: 4, labelSize: 18, scoreSize: 16 },
  { id: 'g6', label: '5~6개', count: 6, labelSize: 14, scoreSize: 12 },
  { id: 'g8', label: '7~8개', count: 8, labelSize: 11, scoreSize: 10 }
];
var current = GROUPS[0];

function scoreRingMarkup(value) {
  var size = 190, stroke = 16, center = size/2, radius = center - stroke/2 - 4;
  var circumference = 2*Math.PI*radius;
  var ratio = Math.max(0, Math.min(100, value))/100;
  var dashoffset = circumference*(1-ratio);
  return '<svg viewBox="0 0 '+size+' '+size+'" class="score-ring">' +
    '<circle cx="'+center+'" cy="'+center+'" r="'+radius+'" class="score-ring-track" stroke-width="'+stroke+'" fill="none" />' +
    '<circle cx="'+center+'" cy="'+center+'" r="'+radius+'" class="score-ring-progress" stroke-width="'+stroke+
    '" fill="none" stroke-dasharray="'+circumference.toFixed(1)+'" stroke-dashoffset="'+dashoffset.toFixed(1)+
    '" transform="rotate(-90 '+center+' '+center+')" stroke="#185FA5" />' +
    '<text x="'+center+'" y="'+(center+size*0.02).toFixed(1)+'" text-anchor="middle" class="score-ring-value">'+value+'</text>' +
    '<text x="'+center+'" y="'+(center+size*0.14).toFixed(1)+'" text-anchor="middle" class="score-ring-label">/ 100점</text>' +
    '</svg>';
}

function radarChartSvg(entries, labelFontSize, scoreFontSize) {
  var size = 620;
  var center = size / 2;
  var maxRadius = center - 140;
  var count = entries.length;
  var points = entries.map(function (item, index) {
    var angle = (Math.PI * 2 * index / count) - Math.PI / 2;
    return { angle: angle, cos: Math.cos(angle), sin: Math.sin(angle), item: item };
  });
  var axisPoint = function (p, ratio) {
    return { x: center + maxRadius * ratio * p.cos, y: center + maxRadius * ratio * p.sin };
  };
  var toStr = function (pt) { return pt.x.toFixed(1) + ',' + pt.y.toFixed(1); };
  var rings = [0.33, 0.66, 1].map(function (ratio) {
    return '<polygon points="' + points.map(function (p) { return toStr(axisPoint(p, ratio)); }).join(' ') + '" class="radar-ring" />';
  }).join('');
  var axes = points.map(function (p) {
    var end = axisPoint(p, 1);
    return '<line x1="' + center + '" y1="' + center + '" x2="' + end.x.toFixed(1) + '" y2="' + end.y.toFixed(1) + '" class="radar-axis" />';
  }).join('');
  var scorePolygon = points.map(function (p) { return toStr(axisPoint(p, p.item.value / 100)); }).join(' ');
  var dots = points.map(function (p) {
    var pt = axisPoint(p, p.item.value / 100);
    return '<circle cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1) + '" r="4.5" class="radar-dot" />';
  }).join('');
  var labels = points.map(function (p) {
    var labelPt = axisPoint(p, 1.1);
    var anchor = p.cos > 0.3 ? 'start' : p.cos < -0.3 ? 'end' : 'middle';
    return '<text x="' + labelPt.x.toFixed(1) + '" y="' + labelPt.y.toFixed(1) +
      '" text-anchor="' + anchor + '" class="radar-label" style="font-size:' + labelFontSize + 'px">' +
      p.item.label +
      '</text><text x="' + labelPt.x.toFixed(1) + '" y="' + (labelPt.y + labelFontSize + 4).toFixed(1) +
      '" text-anchor="' + anchor + '" class="radar-label-score" style="font-size:' + scoreFontSize + 'px">' +
      p.item.value + '점</text>';
  }).join('');
  return '<svg viewBox="0 0 ' + size + ' ' + size + '" class="radar-chart" role="img">' +
    rings + axes + '<polygon points="' + scorePolygon + '" class="radar-score-area" />' + dots + labels + '</svg>';
}

function render() {
  var entries = ALL_LABELS.slice(0, current.count);
  var overallBlock = '<div class="dimension-visual__overall"><div class="dimension-visual__graphic-wrap">' + scoreRingMarkup(74) + '</div></div>';
  var chart = radarChartSvg(entries, current.labelSize, current.scoreSize);
  var chartBlock = '<div class="dimension-visual__chart"><span class="dimension-visual__type">레이더 차트</span>' +
    '<div class="dimension-visual__graphic-wrap">' + chart + '</div></div>';
  document.getElementById('dimension-visual').innerHTML =
    '<div class="dimension-visual__graphics">' + overallBlock + chartBlock + '</div>';

  document.getElementById('labelSize').value = current.labelSize;
  document.getElementById('scoreSize').value = current.scoreSize;
  document.getElementById('labelSizeVal').textContent = current.labelSize + 'px';
  document.getElementById('scoreSizeVal').textContent = current.scoreSize + 'px';
  document.querySelectorAll('.count-tabs button').forEach(function (btn) {
    btn.classList.toggle('active', btn.dataset.id === current.id);
  });
  updateSummary();
}

function updateSummary() {
  document.getElementById('summary').textContent = GROUPS.map(function (g) {
    return g.label + ' → label ' + g.labelSize + 'px / score ' + g.scoreSize + 'px';
  }).join('   |   ');
}

var tabsEl = document.getElementById('countTabs');
GROUPS.forEach(function (g) {
  var btn = document.createElement('button');
  btn.textContent = g.label + ' (' + g.count + '개)';
  btn.dataset.id = g.id;
  btn.onclick = function () { current = g; render(); };
  tabsEl.appendChild(btn);
});

document.getElementById('labelSize').addEventListener('input', function (e) {
  current.labelSize = parseFloat(e.target.value);
  render();
});
document.getElementById('scoreSize').addEventListener('input', function (e) {
  current.scoreSize = parseFloat(e.target.value);
  render();
});
document.getElementById('okBtn').addEventListener('click', function () {
  console.log('CONFIRMED', current.id, current.labelSize, current.scoreSize);
});

render();
</script>
</body>
</html>
