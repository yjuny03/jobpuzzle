<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <body>
    <!-- Landing-page header: guest/user areas are switched by landing.js dummy state. -->
    <header th:fragment="landingHeader" class="site-header">
      <a href="/index.html" th:href="@{/index.html}" class="site-header__brand">
        <img
          src="/images/logo.png"
          th:src="@{/images/logo.png}"
          alt="JobPuzzle"
          class="site-header__logo"
        />
        <span class="site-header__name">JobPuzzle</span>
      </a>

      <nav class="site-header__nav">
        <a href="/dashboard.html" th:href="@{/dashboard.html}">대시보드</a>
        <a href="/my-data.html" th:href="@{/my-data.html}">내 자료</a>
        <a href="/job-analysis.html" th:href="@{/job-analysis.html}">공고 분석</a>
        <a href="/interview.html" th:href="@{/interview.html}">면접 준비</a>
        <a href="/reports.html" th:href="@{/reports.html}">리포트</a>
      </nav>

      <div class="site-header__actions">
        <div class="auth-guest" id="auth-guest">
          <button class="btn btn--ghost" type="button">로그인</button>
          <button class="btn btn--primary" type="button">회원가입</button>
        </div>
        <div class="auth-user" id="auth-user" hidden>
          <div class="user-chip" id="user-chip">
            <span class="user-chip__avatar" id="user-avatar">김</span>
            <span class="user-chip__name" id="user-name">김지원님</span>
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M6 9l6 6 6-6" />
            </svg>
          </div>
          <div class="user-menu" id="user-menu" hidden>
            <a
              href="/settings.html"
              th:href="@{/settings.html}"
              class="user-menu__item"
              >설정</a
            >
            <div class="user-menu__divider"></div>
            <a
              href="/index.html"
              th:href="@{/index.html}"
              class="user-menu__item user-menu__item--danger"
              >로그아웃</a
            >
          </div>
        </div>
      </div>
    </header>

    <!-- Logged-in application header. Dummy user values stay hardcoded until backend owners bind them. -->
    <header th:fragment="appHeader(activePage)" class="site-header">
      <a href="/index.html" th:href="@{/index.html}" class="site-header__brand">
        <img
          src="/images/logo.png"
          th:src="@{/images/logo.png}"
          alt="JobPuzzle"
          class="site-header__logo"
        />
        <span class="site-header__name">JobPuzzle</span>
      </a>

      <nav class="site-header__nav">
        <a
          href="/dashboard.html"
          th:href="@{/dashboard.html}"
          th:classappend="${activePage == 'dashboard'} ? 'is-active' : ''"
          >대시보드</a
        >
        <a
          href="/my-data.html"
          th:href="@{/my-data.html}"
          th:classappend="${activePage == 'mydata'} ? 'is-active' : ''"
          >지원 자료</a
        >
        <a
          href="/job-analysis.html"
          th:href="@{/job-analysis.html}"
          th:classappend="${activePage == 'jobanalysis'} ? 'is-active' : ''"
          >회사 자료</a
        >
        <a
          href="/interview.html"
          th:href="@{/interview.html}"
          th:classappend="${activePage == 'interview'} ? 'is-active' : ''"
          >면접 준비</a
        >
        <a
          href="/reports.html"
          th:href="@{/reports.html}"
          th:classappend="${activePage == 'reports'} ? 'is-active' : ''"
          >리포트</a
        >
      </nav>

      <div class="site-header__actions">
        <div class="auth-user">
          <div class="user-chip" id="app-user-chip">
            <span class="user-chip__avatar">김</span>
            <span class="user-chip__name">김지원님</span>
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M6 9l6 6 6-6" />
            </svg>
          </div>
          <div class="user-menu" id="app-user-menu" hidden>
            <a
              href="/settings.html"
              th:href="@{/settings.html}"
              class="user-menu__item"
              >설정</a
            >
            <div class="user-menu__divider"></div>
            <a
              href="/index.html"
              th:href="@{/index.html}"
              class="user-menu__item user-menu__item--danger"
              >로그아웃</a
            >
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
