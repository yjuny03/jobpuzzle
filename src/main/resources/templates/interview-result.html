<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>면접 결과 | JobPuzzle</title>
  <link rel="stylesheet" href="/css/common.css" th:href="@{/css/common.css}">
  <link rel="stylesheet" href="/css/app.css" th:href="@{/css/app.css}">
  <link rel="stylesheet" href="/css/interview-result.css" th:href="@{/css/interview-result.css}">
</head>
<body>

<div th:replace="~{fragments/header :: appHeader('interview')}"></div>

<div class="app-shell">
  <main class="app-container">
    <div class="result-top-actions">
      <a href="/jobpuzzle/interview" th:href="@{/interview}" class="result-nav-link">
        <span aria-hidden="true">←</span> 새 면접 시작
      </a>
      <a href="/jobpuzzle/reports" th:href="@{/reports}" class="result-nav-link result-nav-link--report">
        리포트 목록 <span aria-hidden="true">→</span>
      </a>
    </div>

    <div class="result-layout">
      <header class="result-banner">
        <div class="result-heading">
          <p class="eyebrow-label">면접 결과</p>
          <h1 id="result-title">면접 결과</h1>
          <p id="result-meta">결과를 불러오는 중입니다.</p>
        </div>
      </header>

      <nav class="tabbar result-tabs" aria-label="면접 결과 보기">
        <button class="tabbar__btn is-active" data-tab="final">최종 리포트</button>
        <button class="tabbar__btn" data-tab="list">질문별 결과</button>
      </nav>

      <section id="interim-actions" class="interim-actions" hidden></section>

      <div class="tab-panel" data-panel="final">
        <section class="card final-report-panel" id="final-report-panel">
          <p class="result-empty-copy">최종 리포트를 불러오는 중입니다.</p>
        </section>
      </div>

      <div class="tab-panel" data-panel="list" hidden>
        <div class="q-layout">
          <div class="q-list" id="q-list"></div>
          <article class="card q-detail" id="q-detail"></article>
        </div>
      </div>
    </div>
  </main>
</div>

<div th:replace="~{fragments/footer :: siteFooter}"></div>

<script src="/js/routes.js" th:src="@{/js/routes.js}"></script>
<script src="/js/common.js" th:src="@{/js/common.js}"></script>
<script src="/js/header.js" th:src="@{/js/header.js}"></script>
<script src="/js/interview-result.js" th:src="@{/js/interview-result.js}"></script>
<script src="/js/interview-result-live.js" th:src="@{/js/interview-result-live.js}"></script>
</body>
</html>
