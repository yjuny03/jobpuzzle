<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>면접 결과 — JobPuzzle</title>
<link rel="stylesheet" href="/css/common.css" th:href="@{/css/common.css}">
<link rel="stylesheet" href="/css/app.css" th:href="@{/css/app.css}">
<link rel="stylesheet" href="/css/interview-result.css" th:href="@{/css/interview-result.css}">
</head>
<body>

<div th:replace="~{fragments/header :: appHeader('interview')}"></div>

<div class="app-shell">
  <div class="app-container">

    <a href="/reports.html" th:href="@{/reports.html}" class="back-link">← 리포트 목록으로</a>

    <div class="result-layout">
      <div>
        <div style="margin-bottom:18px;">
          <p class="eyebrow-label" style="margin-bottom:8px;">면접 결과</p>
          <h1 style="font-size:22px; font-weight:700; margin:0 0 4px;">LUME · 백엔드 개발자 모의면접</h1>
          <p style="font-size:13px; color:#8A93A3; margin:0;">2026.07.11 · 질문 10개</p>
        </div>

        <div class="tabbar" style="margin-bottom:20px;">
          <button class="tabbar__btn is-active" data-tab="list">질문 리스트</button>
          <button class="tabbar__btn" data-tab="score">평가 항목별 점수</button>
          <button class="tabbar__btn" data-tab="resume">이력서 보완</button>
        </div>

        <!-- tab 1: question list -->
        <div class="tab-panel" data-panel="list">
          <div class="q-layout">
            <div class="q-list" id="q-list"></div>
            <div class="card" id="q-detail" style="min-height:440px;"></div>
          </div>
        </div>

        <!-- tab 2: score -->
        <div class="tab-panel" data-panel="score" hidden>
          <div class="card card--pad-lg">
            <p style="font-size:14px; font-weight:700; margin:0 0 4px;">평가 항목별 점수</p>
            <p style="font-size:12.5px; color:#8A93A3; margin:0 0 18px;">낮은 점수부터 확인해보세요</p>
            <div style="display:flex; flex-direction:column; gap:10px;" id="eval-list"></div>
          </div>
        </div>

        <!-- tab 3: resume -->
        <div class="tab-panel" data-panel="resume" hidden>
          <div style="display:flex; flex-direction:column; gap:12px;" id="resume-cards"></div>
        </div>
      </div>

      <!-- sidebar -->
      <div style="display:flex; flex-direction:column; gap:14px;">
        <div class="card" style="text-align:center;">
          <div id="overall-donut" style="margin:0 auto 12px;"></div>
          <p style="font-size:13px; color:#8A93A3; margin:0 0 2px;">종합 준비도</p>
          <p style="font-size:14px; font-weight:700; margin:0;" id="overall-score-label"></p>
        </div>

        <div class="weakness-sidebar">
          <p style="font-size:12.5px; font-weight:700; color:#8A5A22; margin:0 0 4px;">약점 태그</p>
          <p style="font-size:11px; color:#B08A4E; margin:0 0 14px;">반복적으로 확인된 약점이에요 · 항목별 점수와 최종 점수가 모두 70점을 넘어야 해결로 처리돼요</p>
          <div style="display:flex; flex-direction:column; gap:14px;" id="weakness-list"></div>
          <a href="/interview.html" th:href="@{/interview.html}" class="btn btn--primary" style="justify-content:center; margin-top:16px;">약점 보완 모드로 연습하기</a>
        </div>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: siteFooter}"></div>

<script src="/js/common.js" th:src="@{/js/common.js}"></script>
<script src="/js/header.js" th:src="@{/js/header.js}"></script>
<script src="/js/interview-result.js" th:src="@{/js/interview-result.js}"></script>
</body>
</html>
