<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>면접 준비 — JobPuzzle</title>
<link rel="stylesheet" href="/css/common.css" th:href="@{/css/common.css}">
<link rel="stylesheet" href="/css/app.css" th:href="@{/css/app.css}">
<link rel="stylesheet" href="/css/mydata.css" th:href="@{/css/mydata.css}">
<link rel="stylesheet" href="/css/interview.css" th:href="@{/css/interview.css}">
</head>
<body>

<div th:replace="~{fragments/header :: appHeader('interview')}"></div>

<div class="app-shell">
  <div class="app-container">

    <p class="eyebrow-label">면접 관리</p>
    <h1 class="page-title">질문 생성 · 모의면접</h1>
    <p class="page-subtitle">공고와 자료를 바탕으로 질문을 만들고 실전처럼 연습하세요</p>

    <div class="tabbar" style="margin-bottom:24px;">
      <span class="tabbar__btn is-active">질문 생성</span>
      <a href="/interview-result.html" th:href="@{/interview-result.html}" class="tabbar__btn" style="text-decoration:none; display:inline-block;">답변 평가</a>
    </div>

    <div id="step-root"></div>

  </div>
</div>

<!-- material register modal: 1단계 등록 폼 -> 2단계 추출 결과 확인/확정 (document-flow.js 재사용) -->
<div class="modal-overlay" id="material-register-modal" hidden>
  <div class="modal-box modal-box--lg">
    <div class="flex-row" style="justify-content:space-between; margin-bottom:16px;">
      <p style="font-size:16px; font-weight:700; margin:0;" id="material-register-title"></p>
      <button class="modal-x" id="material-register-close">&times;</button>
    </div>

    <div id="material-register-form">
      <input class="text-input" id="material-register-name" placeholder="자료명" style="margin-bottom:14px;">
      <div class="tabbar tabbar--sm" style="margin-bottom:14px;">
        <button class="tabbar__btn is-active" data-material-method="file">파일 업로드</button>
        <button class="tabbar__btn" data-material-method="text">직접 입력</button>
      </div>
      <div data-material-method-panel="file">
        <input type="file" accept=".pdf,.jpg,.jpeg,.png" class="file-input" id="material-register-file">
        <p class="file-name-preview">PDF, JPG, PNG 파일만 가능하며 최대 10MB까지 업로드할 수 있습니다.</p>
      </div>
      <div data-material-method-panel="text" hidden>
        <textarea class="textarea-input" id="material-register-content" style="height:180px;" placeholder="내용을 직접 입력해주세요"></textarea>
      </div>
      <div class="flex-row gap-10" style="justify-content:flex-end; margin-top:16px;">
        <button class="btn btn--ghost" style="border:1px solid #E3E7ED;" id="material-register-cancel">취소</button>
        <button class="btn btn--primary" id="material-register-submit">등록하기</button>
      </div>
    </div>

    <div id="material-register-panel" hidden></div>
  </div>
</div>

<div th:replace="~{fragments/footer :: siteFooter}"></div>

<script src="/js/common.js" th:src="@{/js/common.js}"></script>
<script src="/js/header.js" th:src="@{/js/header.js}"></script>
<script src="/js/document-flow.js" th:src="@{/js/document-flow.js}"></script>
<script src="/js/interview.js" th:src="@{/js/interview.js}"></script>
</body>
</html>
