<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원 관리 — JobPuzzle 관리자</title>
<link rel="stylesheet" href="/css/common.css" th:href="@{/css/common.css}">
<link rel="stylesheet" href="/css/app.css" th:href="@{/css/app.css}">
</head>
<body>

<div th:replace="~{fragments/header :: appHeader('admin')}"></div>

<div class="app-shell">
  <div class="app-container">

    <h1 class="page-title">회원 관리</h1>
    <p class="page-subtitle">아이디·이름·이메일로 검색하고 상태로 필터링할 수 있어요</p>

    <div class="tabbar" style="margin-bottom:20px; flex-wrap:wrap;">
      <a class="tabbar__btn is-active" href="/admin/users" th:href="@{/admin/users}">회원 관리</a>
      <a class="tabbar__btn" href="/admin/job-categories" th:href="@{/admin/job-categories}">직무 분류 관리</a>
      <a class="tabbar__btn" href="/admin/guide-usage" th:href="@{/admin/guide-usage}">가이드 사용 이력</a>
      <a class="tabbar__btn" href="/admin/ai-logs" th:href="@{/admin/ai-logs}">AI 오류 로그</a>
    </div>

    <div class="flex-row" style="gap:8px; margin-bottom:20px;">
      <select class="select-input" id="user-search-field" style="max-width:110px;">
        <option value="LOGIN_ID">아이디</option>
        <option value="EMAIL">이메일</option>
        <option value="NAME">이름</option>
      </select>
      <input class="text-input" id="user-search-input" placeholder="검색어 입력" style="max-width:240px;">
      <select class="select-input" id="user-status-filter" style="max-width:110px;">
        <option value="">전체 상태</option>
        <option value="ACTIVE">활성</option>
        <option value="WITHDRAWN">탈퇴</option>
      </select>
      <button class="btn btn--primary" id="user-search-btn">검색</button>
      <button class="btn btn--ghost" style="border:1px solid #E3E7ED;" id="user-search-reset">초기화</button>
    </div>

    <div class="table-wrap">
      <div class="table-head" style="grid-template-columns:1fr 1fr 1.6fr 0.7fr 0.8fr 0.7fr 1fr;">
        <span>아이디</span><span>이름</span><span>이메일</span><span>권한</span><span>상태</span><span>잠금</span><span>가입일</span>
      </div>
      <div id="admin-user-rows"></div>
    </div>
    <div class="flex-row" style="justify-content:center; gap:8px; margin-top:16px;" id="admin-user-pagination"></div>

  </div>
</div>

<script src="/js/common.js" th:src="@{/js/common.js}"></script>
<script src="/js/header.js" th:src="@{/js/header.js}"></script>
<script src="/js/admin-users.js" th:src="@{/js/admin-users.js}"></script>

</body>
</html>
