<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>맞춤 분석 — JobPuzzle</title>
  <link rel="stylesheet" href="/css/common.css" th:href="@{/css/common.css}">
  <link rel="stylesheet" href="/css/app.css" th:href="@{/css/app.css}">
  <link rel="stylesheet" href="/css/analysis.css" th:href="@{/css/analysis.css}">
</head>
<body>
<div th:replace="~{fragments/header :: appHeader('interview')}"></div>
<main class="analysis-page">
  <div class="analysis-page__glow analysis-page__glow--one" aria-hidden="true"></div>
  <div class="analysis-page__glow analysis-page__glow--two" aria-hidden="true"></div>
  <div class="analysis-container">
    <header class="analysis-heading">
      <div>
        <p class="analysis-kicker">JOB FIT REPORT</p>
        <h1>지원 준비 상태를<br><span>한눈에 확인해 보세요.</span></h1>
        <p>채용공고와 지원 자료를 연결해 강점, 부족한 근거, 면접 질문을 정리했습니다.</p>
      </div>
      <a href="/interview.html" th:href="@{/interview.html}" class="analysis-back">면접 준비로 돌아가기</a>
    </header>
    <div
      id="analysis-root"
      class="analysis-root"
      th:attr="data-analysis-case-id=${analysisCaseId}"
      aria-live="polite"
      aria-busy="true"
    ></div>
  </div>
</main>
<div th:replace="~{fragments/footer :: siteFooter}"></div>
<script src="/js/common.js" th:src="@{/js/common.js}"></script>
<script src="/js/header.js" th:src="@{/js/header.js}"></script>
<script src="/js/analysis.js" th:src="@{/js/analysis.js}"></script>
</body>
</html>
